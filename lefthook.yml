# The checks the README lists, run at the push boundary so a failure is yours
# before it is the remote's. `.github/workflows/checks.yml` runs the same three
# stages on what landed; this is the copy that keeps it from landing. The two
# command lists are deliberately identical.
#
# Nx owns the parallelism, lefthook owns the ordering: one `run-many` lets a
# single Nx process schedule and cache all targets, where separate lefthook
# jobs would be processes competing for one daemon and one cache.
#
# `LEFTHOOK=0 git push` skips all of it.
#
# To run this without pushing:
#
#     npx lefthook run pre-push --force
#
# `--force` is load-bearing. Lefthook resolves the push range first and skips
# every job when it is empty — a branch level with its upstream prints
# `(skip) no matching push files` under a green summary, having run nothing.
# Add `--job format`, `--job checks` or `--job e2e` to narrow it to one stage.
pre-push:
  piped: true
  jobs:
    - name: format
      run: npx prettier --check .

    # `build` is here for what typecheck cannot reach: `tsc --noEmit` does not
    # check Angular templates, and the AOT compiler does. The bundle check reads
    # that production build's graph and rejects development-only entry points.
    - name: checks
      run: npx nx run-many -t lint typecheck test build verify-production-bundle

    # Last and alone. Nx starts `book:serve-memory` for it as a continuous
    # dependency of the inferred `e2e` target, so this is the job that boots a
    # real dev server on :4200 — but only on a cold cache. The target itself is
    # cached (`npx nx show project book-e2e --json`), so a repeat push replays it.
    - name: e2e
      run: npx nx e2e book-e2e
